<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <!-- Tytuł strony, który można nadpisać w szablonach -->
    <link rel="stylesheet" href="{{ url_for('static', filename = 'styles.css') }}" />
    <!-- Link do wspólnego arkusza stylów CSS-->
    <meta name="csrf-token" content="{{ csrf_token()}}" />
    <!-- Meta tag z tokenem CSRF-->
</head>

<body>
    {% include 'partials/flash_messages.html' %}
    {% block body %}
    {% endblock %}
    <div class="modal-overlay" id="applyModal">

        <div class="modal">

            <div class="modal-header">

                <h2 id="modalJobTitle">
                    Aplikuj
                </h2>

                <button class="modal-close" id="closeModal">
                    ×
                </button>

            </div>

            <form method="POST" action="{{ url_for('jobs.apply_job') }}" enctype="multipart/form-data">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <input type="hidden" name="job_id" id="modalJobId">

                <!-- CV -->

                <div class="form-group">

                    <label>CV (PDF)</label>

                    <input type="file" name="cv" accept=".pdf" class="form-control">

                </div>


                <button class="btn">
                    Zapisz aplikację
                </button>

            </form>

        </div>

    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <!-- Link do skryptu JavaScript -->



</body>

</html>
